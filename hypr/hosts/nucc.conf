# nucc

# monitor=,5120x1440@239.76Hz,auto,1

exec-once = flaresolverr
exec-once = radarr
exec-once = Prowlarr
exec-once = qbittorrent
exec-once = Sonarr
exec-once = Seerr

# Remote desktop (see modules/server.nix): create a virtual monitor and
# stream this session over VNC.
# `;` not `&&` after output create: when booted with no monitor attached,
# Hyprland may have already made a fallback headless output, which makes the
# create call fail on the duplicate name - wayvnc should still start.
exec-once = sleep 2; hyprctl output create headless HEADLESS-1; wayvnc --output=HEADLESS-1 localhost 5900
